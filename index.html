<!-- Diagnostika: když se něco nenačte nebo spadne kód, ukáže se chyba přímo na stránce (místo prázdné obrazovky) -->
<script>
(function () {
  function show(msg) {
    var a = document.getElementById('app'); if (!a) return;
    a.innerHTML = '<div style="max-width:640px;margin:8vh auto;padding:16px;border:1px solid rgba(244,63,94,.6);border-radius:14px;background:rgba(244,63,94,.15);color:#fecdd3;font:14px/1.5 system-ui">'
      + '<b>⚠ Aplikaci se nepodařilo spustit</b><pre style="white-space:pre-wrap;margin:8px 0 0;font:12px/1.4 ui-monospace,monospace">' + String(msg).replace(/</g, '&lt;') + '</pre></div>';
  }
  window.addEventListener('error', function (e) {
    if (e.target && e.target.tagName === 'SCRIPT' && e.target.dataset && e.target.dataset.optional) return;
    if (e.target && e.target.tagName && e.target.tagName !== 'SCRIPT') return;   // nenačtené písmo nebo obrázek aplikaci nezastaví (bez internetu se použije písmo telefonu)   // nepovinná knihovna (např. ověření „nejsem robot“)
    if (e.target && e.target.tagName === 'SCRIPT') show('Nepodařilo se načíst knihovnu:\n' + e.target.src + '\nZkontrolujte připojení k internetu / blokování reklam.');
    else show((e.message || 'Neznámá chyba') + (e.lineno ? '\n(' + String(e.filename || '').split('/').pop().split('?')[0] + ', řádek ' + e.lineno + ')' : ''));
  }, true);
  window.addEventListener('unhandledrejection', function (e) { show('Chyba: ' + (e.reason && e.reason.message || e.reason)); });
})();
</script>
