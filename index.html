<!-- Diagnostika: když se něco nenačte nebo spadne kód, ukáže se chyba přímo na stránce (místo prázdné obrazovky) -->
<script>
(function () {
  function show(msg) {
    var a = document.getElementById('app'); if (!a) return;
    a.innerHTML = '<div style="max-width:640px;margin:8vh auto;padding:16px;border:1px solid rgba(244,63,94,.6);border-radius:14px;background:rgba(244,63,94,.15);color:#fecdd3;font:14px/1.5 system-ui">'
      + '<b>⚠ Aplikaci se nepodařilo spustit</b><pre style="white-space:pre-wrap;margin:8px 0 0;font:12px/1.4 ui-monospace,monospace">' + String(msg).replace(/</g, '&lt;') + '</pre></div>';
  }
  window.addEventListener('error', function (e) {
    if (e.target && e.target.tagName === 'SCRIPT') show('Nepodařilo se načíst knihovnu:\n' + e.target.src + '\nZkontrolujte připojení k internetu / blokování reklam.');
    else show((e.message || 'Neznámá chyba') + (e.lineno ? '\n(řádek ' + e.lineno + ')' : ''));
  }, true);
  window.addEventListener('unhandledrejection', function (e) { show('Chyba: ' + (e.reason && e.reason.message || e.reason)); });
})();
</script>
<!-- Supabase JS SDK (databáze, přihlášení, realtime) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* =====================================================================
   STYLY – rozdělené do sekcí:
   1. Proměnné a základ   2. Hlavička a navigace   3. Formuláře a tlačítka
   4. Karty a rozložení   5. Štítky a stavy        6. Modul: Docházka/Plánovač
   7. Modul: Chat         8. Modul: Soupiska       9. Responzivita
   ===================================================================== */

/* ---------- 1. PROMĚNNÉ A ZÁKLAD ---------- */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --tx:#eef1f7;                 /* hlavní text */
  --mut:#8b94a7;                /* tlumený text */
  --bd:rgba(255,255,255,.1);    /* ohraničení */
  --gl:rgba(255,255,255,.06);   /* sklo (glassmorphism) */
  --g:#22c55e;                  /* zelená  – OK / trénink */
  --b:#3d78e0;                  /* modrá   – zápas / info (odstín z loga, světlejší pro čitelnost) */
  --br:#e31e26;                 /* červená z loga */
  --bb:#2452a1;                 /* modrá z loga */
  --r:#ff4d5a;                  /* červená – chyba / dluh / zrušeno */
  --y:#f59e0b;                  /* oranžová – varování */
  --c:255,255,255;              /* aktuální "stavová" barva (RGB), mění ji třídy .ok .no .wa .z */
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#0a0d14}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--tx);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(60% 42% at 8% 0,rgba(227,30,38,.26),transparent),
    radial-gradient(55% 42% at 96% 6%,rgba(36,82,161,.42),transparent),
    #0a0d14;
  background-attachment:fixed;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:rgba(10,13,20,.85)}
.wrap{max-width:1000px;margin:0 auto;padding:12px 16px 40px}
.col{max-width:640px;margin:0 auto}                 /* úzký sloupec pro seznamy */
h2{font-size:16px;margin:16px 0 8px}
.mut{color:var(--mut);font-size:13px}
.cg{color:var(--g)} .cr{color:var(--r)} .cw{color:var(--y)}

/* ---------- 2. HLAVIČKA A NAVIGACE ---------- */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(10,13,20,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
.hdi{display:flex;align-items:center;gap:8px;padding-top:8px;padding-bottom:8px}
.lg{width:40px;height:40px;flex:none;border-radius:50%;object-fit:cover;box-shadow:0 2px 10px rgba(0,0,0,.45)}
.ttl{flex:1;min-width:0}
.ttl b,.ttl span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{font-size:12px;color:var(--mut)}
.hd select{width:auto;max-width:150px;margin:0}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:4px 0 10px;padding-bottom:2px}
.tabs .chip{white-space:nowrap}
.kp>*{margin-bottom:12px!important}.kp>h2{margin-bottom:0!important}
.bnav,.msheet{display:none}
@media(max-width:759px){
  .tabs{display:none}
  body{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(10,13,20,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--mut);font:inherit;font-size:11px;padding:6px 2px;border-radius:12px;position:relative;cursor:pointer}
  .bnav button .ic{font-size:22px;line-height:1}
  .bnav button span.tx{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bnav button.on{color:var(--tx);background:linear-gradient(135deg,rgba(227,30,38,.35),rgba(36,82,161,.55))}
  .bnav .bd{margin:0;position:absolute;top:0;right:22%;min-width:16px;height:16px;border-radius:8px;background:#e31e26;color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px}
  .msheet{display:block;position:fixed;inset:0;z-index:39;background:rgba(0,0,0,.55)}
  .msheet .mg{position:absolute;left:10px;right:10px;bottom:calc(74px + env(safe-area-inset-bottom));background:#121826;border:1px solid var(--bd);border-radius:18px;padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .msheet .mg button{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--gl);border:1px solid var(--bd);border-radius:14px;color:var(--tx);font:inherit;font-size:12px;padding:12px 4px;cursor:pointer}
  .msheet .mg button.on{border-color:rgba(140,170,240,.7);background:linear-gradient(135deg,rgba(227,30,38,.35),rgba(36,82,161,.55))}
  .msheet .mg .ic{font-size:24px}
}
.bd{background:var(--r);color:#fff;border-radius:99px;font:600 11px/1 system-ui;padding:2px 6px;margin-left:6px;font-style:normal}  /* odznak nepřečtených */
.nt{padding:8px 4px;border-bottom:1px solid var(--bd);font-size:14px;cursor:pointer}
.nt.un{border-left:3px solid var(--b);padding-left:8px}                           /* nepřečtená notifikace */
.pro{display:block;width:100%;text-align:left;padding:14px;margin-bottom:10px;color:var(--tx);font:inherit;cursor:pointer}  /* profil na přihlašovací obrazovce */
.hero{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.hero .lg{width:64px;height:64px}

/* ---------- 3. FORMULÁŘE A TLAČÍTKA ---------- */
.ib,.btn,.chip,select,input,textarea{font:inherit;color:var(--tx);background:var(--gl);border:1px solid var(--bd);border-radius:12px;padding:9px 12px}
.ib,.btn,.chip{cursor:pointer;transition:.15s}
.btn:active,.chip:active{transform:scale(.97)}
select option{background:#151a24}
input,textarea,select{width:100%;margin:4px 0}
/* ikonové tlačítko v hlavičce (zvonek, odhlásit) – musí být AŽ ZA obecným pravidlem výše, aby ho přepsalo */
.ib{position:relative;width:auto;padding:8px 10px}
.ib i{position:absolute;top:-5px;right:-5px;background:var(--r);border-radius:99px;font:600 11px/1 system-ui;padding:3px 6px;font-style:normal}
a.btn{text-decoration:none;text-align:center;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;max-width:min(440px,92vw);padding:10px 14px;border-radius:14px;background:rgba(244,63,94,.94);color:#fff;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.good{background:rgba(22,163,74,.95)}
label.mut input,label.mut select{margin-top:2px}
.kid{display:inline-flex;align-items:center;gap:6px;padding:3px 6px 3px 10px;border:1px solid var(--bd);border-radius:99px;background:var(--gl);font-size:13px;margin:0 6px 6px 0}
.kid button{border:0;background:none;color:var(--r);cursor:pointer;font:inherit;padding:0 4px}
label.mut{display:block;margin-top:8px}

/* ---------- 4. KARTY A ROZLOŽENÍ ---------- */
.glass,.card{background:var(--gl);border:1px solid var(--bd);border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.3);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card{padding:14px;margin-bottom:10px}
/* panel notifikací – musí být AŽ ZA .glass, aby přebil průhledné pozadí */
.panel{position:absolute;right:10px;top:100%;width:min(340px,92vw);padding:10px;margin-top:6px;background:rgba(18,22,32,.95)}
.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}   /* responzivní mřížka karet */
.g2>.card{margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.pay{display:flex;justify-content:space-between;align-items:center;gap:8px}              /* řádek "vlevo / vpravo" */
.pl{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd)}
.pl input{width:auto}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.1);margin:8px 0;overflow:hidden}   /* ukazatel (docházka, platby) */
.bar i{display:block;height:100%;border-radius:99px;background:var(--g)}
.warn{background:rgba(244,63,94,.18);border:1px solid rgba(244,63,94,.5);border-radius:12px;padding:9px;margin-top:8px;font-size:13px}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;z-index:50;padding:16px}   /* modální okno */
.mo .card{width:100%;max-width:400px;background:#161b26}

/* ---------- 5. ŠTÍTKY A STAVOVÉ BARVY ---------- */
.ok{--c:34,197,94} .no,.x{--c:244,63,94} .wa{--c:245,158,11} .z{--c:61,120,224} .t{--c:61,120,224}
.pill,.btn.ok,.btn.no,.btn.wa,.chip.on{background:rgba(var(--c),.22);border-color:rgba(var(--c),.6)}
/* značkové barvy (červená + modrá z loga): aktivní záložka a hlavní tlačítka */
.chip.on{background:linear-gradient(135deg,rgba(227,30,38,.45),rgba(36,82,161,.7));border-color:rgba(140,170,240,.65)}
button.btn.ok{background:linear-gradient(135deg,rgba(227,30,38,.55),rgba(36,82,161,.8));border-color:rgba(140,170,240,.65);font-weight:600}
.tl div.mine{background:rgba(227,30,38,.5);border-color:rgba(255,120,128,.9)}
.mo .card{max-height:92vh;overflow:auto}
.pw{position:relative;display:block}.pw input{padding-right:46px}.eye{position:absolute;right:2px;top:4px;bottom:4px;width:42px;background:none;border:0;color:var(--mut);font-size:18px;cursor:pointer}
.keep{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--mut);font-size:14px}.keep input{width:auto;margin:0}
.pill{display:inline-block;padding:2px 10px;border:1px solid;border-radius:99px;font-size:12px;white-space:nowrap}
.ev{border-left:4px solid rgb(var(--c))}                       /* karta události – barevný pruh */
.ev.x{opacity:.75}

/* ---------- 6. DOCHÁZKA A PLÁNOVAČ ---------- */
.tl{position:relative;height:46px;border-radius:12px;background:var(--gl);border:1px solid var(--bd);overflow:hidden}   /* časová osa hřiště */
.tl div{position:absolute;top:3px;bottom:3px;border-radius:9px;background:rgba(61,120,224,.4);border:1px solid rgba(61,120,224,.8);display:grid;place-items:center;font-size:12px;cursor:pointer;overflow:hidden;white-space:nowrap}
.tk{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);padding:2px 2px 6px}

/* ---------- 7. CHAT ---------- */
.chat{display:flex;flex-direction:column;gap:8px;max-height:min(55vh,460px);overflow-y:auto;padding:2px}
.bub{max-width:84%;padding:8px 12px;border-radius:16px 16px 16px 4px;background:var(--gl);border:1px solid var(--bd);align-self:flex-start;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;border-radius:16px 16px 4px 16px;background:rgba(36,82,161,.55);border-color:rgba(100,140,230,.6)}
.bub .nm{font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:center;margin-bottom:2px}
.bub .tm{font-size:11px;color:var(--mut);text-align:right;margin-top:2px}
.cin{display:flex;gap:8px;margin-top:10px}
.cin input{margin:0;flex:1}
.cin .btn{flex:none}

/* ---------- 8. SOUPISKA A PROFILY HRÁČŮ ---------- */
.av{border-radius:50%;object-fit:cover;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;margin:0 auto;border:2px solid rgba(255,255,255,.18)}   /* avatar / fotka */
img.av{display:block}
.pcard{display:flex;align-items:center;gap:12px;cursor:pointer}
.pcard .av{margin:0}
.pcard .pi{flex:1;min-width:0}
.pcard .pi b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr{text-align:right;display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.stat{text-align:center;margin:0;padding:12px 6px}
.stat b{display:block;font-size:24px}

/* ---------- 9. RESPONZIVITA ---------- */
@media(max-width:480px){.hdi .lg{display:none}.hd select{max-width:118px}}
@media(min-width:760px){.wrap{padding:20px 24px 50px}}
</style>
</head>

/* =====================================================================
   TJ SOKOL – KLUBOVÝ SYSTÉM (jeden soubor, data v cloudu Supabase)

   NEŽ ZAČNETE:  1) v souboru tj-sokol-schema.sql vytvořte tabulky (Supabase → SQL Editor)
                 2) níže vyplňte SUPABASE_KEY (Project Settings → API → "Publishable"/anon key)
                 3) nasaďte Edge Function admin-users (zakládání účtů – viz admin-users-edge-function.ts)
   Klíč service_role se NIKDY nevkládá do tohoto souboru.

   OBSAH
     0. SUPABASE     – připojení k databázi
     1. CONFIG       – nastavení a texty, které se často mění
     2. DB           – paměť aplikace (kopie dat načtená ze Supabase)
     3. UI           – stav rozhraní (kdo je přihlášen, otevřená záložka…)
     4. Util         – drobné pomocné funkce (formátování, avatar…)
     5. Model        – dotazy nad načtenými daty (kdo je rodič koho, nepřečtené…)
     6. Notifs       – notifikace (zvonek)
     7. Auth         – přihlášení e-mailem a heslem / odhlášení
     7b. Sync        – načítání a ukládání dat do Supabase + Realtime
     8. MODULY       – každá funkční oblast = jedna třída
          Calendar   kalendář, omluvy, spolujízda      (rodič)
          Payments   platby, dokumenty, import         (rodič + vedení)
          Attendance docházka a účast trenéra          (trenér)
          Events     správa událostí a nominace        (trenér)
          Roster     soupiska a profily hráčů          (trenér)
          Notes      trenérský deník                   (trenér)
          Chat       chaty kategorií + zprávy od klubu (rodič + trenér)
          Messages   zprávy vedení (komu co poslat)    (vedení)
          Planner    plánovač hřišť                    (vedení)
          Users      správa uživatelů a dětí           (vedení)
     9. App          vykreslení stránky a záložky podle role

   JAK TO FUNGUJE
     • Každá třída má statické metody:  view() vrací HTML, ostatní jsou akce.
     • Akce změní data v DB, uloží je přes Sync do Supabase a zavolají App.render().
     • Realtime: nové zprávy chatu, docházka a omluvy se objeví všem ihned.
     • Oprávnění nehlídá jen aplikace – vynucuje je databáze (Row Level Security).
     • Tlačítka v HTML volají akce přímo:  onclick="Chat.send()".

   JAK PŘIDAT NOVOU ZÁLOŽKU
     1) napište třídu s metodou view()   2) přidejte ji do TABS (sekce 9)
     3) případně přidejte stav do UI, data do DB a tabulku do SQL.
   ===================================================================== */

  keep() { try { return localStorage.getItem(KEEP_KEY) !== '0'; } catch (e) { return true; } },

  setItem(k, v) { try { if (authStorage.keep()) { localStorage.setItem(k, v); sessionStorage.removeItem(k); } else { sessionStorage.setItem(k, v); localStorage.removeItem(k); } } catch (e) {} },
  removeItem(k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) {} }
};

/* =====================================================================
   4. Util – pomocné funkce bez vazby na data
   ===================================================================== */
class Util {
  /** Ochrana proti vložení HTML (vždy použít u textů zadaných uživatelem). */
  /** Příjmení = poslední slovo jména ("Dominik Kondaš" → "Kondaš"). */
  static surname(n) { const w = String(n || '').trim().split(/\s+/); return w[w.length - 1] || ''; }
  static esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  /** Řetězec bezpečný do onclick='...' (apostrofy, uvozovky). */
  static q(s) { return Util.esc(String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'")); }
  /** Text bez diakritiky a malými písmeny – pro hledání. */
  static norm(s) { return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }
  /** Pondělí zobrazovaného týdne (od pátku do neděle se ukazuje už příští týden). */
  static weekStart() {
    const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + 2);
    d.setDate(d.getDate() - (d.getDay() + 6) % 7);
    return d;
  }
  /** Datum dne v zobrazovaném týdnu: 0 → objekt Date pro pondělí. */
  static dayDate(d) { const x = Util.weekStart(); x.setDate(x.getDate() + d); return x; }
  /** Datum jako "2026-10-19" (pro databázi, v místním čase). */
  static iso(x) { return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; }
  /** Den v týdnu (0 = Po) z "2026-10-19". */
  static dayIndex(iso) { const [y, m, d] = iso.split('-').map(Number); return Math.round((new Date(y, m - 1, d) - Util.weekStart()) / 864e5); }
  /** Barva docházky: 70–100 % zelená, 40–69 % žlutá, 0–39 % červená. */
  static attLvl(p) { return p >= CONFIG.attGood ? 'g' : p >= CONFIG.attMid ? 'y' : 'r'; }
  static attCls(p) { return {g: 'cg', y: 'cw', r: 'cr'}[Util.attLvl(p)]; }
  static attBg(p)  { return 'var(--' + Util.attLvl(p) + ')'; }
  static attPill(p) { return {g: 'ok', y: 'wa', r: 'no'}[Util.attLvl(p)]; }
  /** "2026-10-12" → "Po 12.10." */
  static isoShort(iso) { const [y, m, d] = String(iso).split('-').map(Number); if (!y) return '—'; return `${CONFIG.days[(new Date(y, m - 1, d).getDay() + 6) % 7]} ${d}.${m}.`; }
  /** Popisek dne: 0 → "Po 19.10." */
  static date(d) { const x = Util.dayDate(d); return `${CONFIG.days[d]} ${x.getDate()}.${x.getMonth() + 1}.`; }
  /** Časová značka zprávy z databáze: "čt 15.10. 18:02". */
  static stamp(ts) {
    const d = new Date(ts); if (isNaN(d)) return '';
    return `${CONFIG.days[(d.getDay() + 6) % 7].toLowerCase()} ${d.getDate()}.${d.getMonth() + 1}. ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
  }
  /** Dnešní datum pro trenérský deník: "16.10.". */
  static today() { const d = new Date(); return `${d.getDate()}.${d.getMonth() + 1}.`; }
  /** Datum z databáze "2026-10-11" → "11.10.". */
  static short(iso) { const [, m, d] = iso.split('-').map(Number); return `${d}.${m}.`; }
  /** Telefon bez mezer (pro odkaz tel:). */
  static phone(x) { return String(x).replace(/[^\d+]/g, ''); }
  /** "16:30" → 990 minut. */
  static toMin(x) { const [a, b] = x.split(':'); return +a * 60 + +b; }
  /** 990 → "16:30". */
  static toTime(m) { return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0'); }
  /** Červený odznak s počtem (nebo nic, když je 0). */
  static badge(n) { return n ? `<i class="bd">${n}</i>` : ''; }
  /** Název hřiště: 'A' → "Hřiště A", 'Hala' → "Hala". */
  static venue(f) { return f == 'Hala' ? 'Hala' : f == 'C' ? 'Hřiště C – Loučka' : f == 'B' ? 'Hřiště B – Umělka' : 'Hřiště ' + f; }
  /** Stabilní odstín barvy podle textu (pro avatary). */
  static hue(s) { return [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7); }
  /** Věk a ročník hráče: "9 let (ročník 2017)". */
  static age(m) { return m.by ? `${new Date().getFullYear() - m.by} let (ročník ${m.by})` : 'ročník neuvedený'; }
  /** Iniciály hráče z celého jména. */
  static initials(m) { return (m.full || m.n).split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase(); }
  /** Kulatý avatar hráče: fotka, nebo barevné iniciály. */
  static avatar(m, size) {
    if (m.ph && /^data:image\//.test(m.ph)) return `<img class="av" style="width:${size}px;height:${size}px" src="${m.ph}" alt="Fotka hráče">`;
    const h = Util.hue(m.n);
    return `<div class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.38)}px;background:linear-gradient(135deg,hsl(${h},65%,45%),hsl(${(h+50)%360},65%,32%))">${Util.esc(Util.initials(m))}</div>`;
  }
}
const $ = sel => document.querySelector(sel);   // zkratky používané v celém kódu
const esc = Util.esc;


/* =====================================================================
   5. Model – dotazy nad daty (nic nevykresluje, jen odpovídá)
   ===================================================================== */
class Model {
  static member(name)    { return DB.members.find(m => m.n == name); }
  static byId(id)        { return DB.members.find(m => m.id == id); }
  static team(kid)       { const m = Model.member(kid); return m ? m.t : ''; }
  static membersOf(team) { return DB.members.filter(m => m.t == team); }
  static event(id)       { return DB.events.find(e => e.id == id); }
  /** Docházka trenéra na tréninky: {p: přítomen, t: celkem, pct, abs: [data absencí od nejnovější]}. Počítají se tréninky, u kterých má potvrzeno „přijdu“ / „nemohu“. */
  static coachStats(uid) {
    let p = 0, t = 0; const abs = [];
    Object.keys(DB.coachAtt).forEach(k => {
      if (!k.startsWith(uid + '|')) return;
      const ev = DB.coachEv[k] || {k: 't', d: ''};
      if (ev.k != 't') return;
      t++; if (DB.coachAtt[k] == 'y') p++; else abs.push(ev.d);
    });
    abs.sort().reverse();
    return {p, t, pct: t ? Math.round(p / t * 100) : 0, abs};
  }
  /** Příjmení trenérů, kteří potvrdili účast na události (bez potvrzení: příjmení určeného trenéra). */
  static coachSurnames(e) {
    const L = Object.keys(DB.coachAtt).filter(k => DB.coachAtt[k] == 'y' && k.slice(k.indexOf('|') + 1) == String(e.id)).map(k => DB.coachNm[k]).filter(Boolean);
    return [...new Set(L)].sort((a, b) => a.localeCompare(b, 'cs')).join(', ') || Util.surname(e.c);
  }
  static eventsOf(team)  { return DB.events.filter(e => e.tm == team).sort((a, b) => a.d - b.d); }

  /** Dluh člena v Kč (součet nezaplacených příspěvků). */
  static debt(m) { return DB.payItems.reduce((s, x, i) => s + (m.p[i] ? 0 : x.a), 0); }

  /** Kategorie, do jejichž chatu uživatel patří (rodič = kategorie dětí, trenér = svoje, vedení = žádná). */
  /** Trenér nebo správce (ten pracuje za trenéra zvolené kategorie). */
  static coachLike(u) { return u.r == 'c' || u.r == 'a'; }
  /** Vedení nebo správce. */
  static mgmt(u) { return u.r == 'v' || u.r == 'a'; }
  static teamsOf(u) { return u.r == 'p' ? [...new Set(u.kids.map(k => Model.team(k)).filter(Boolean))] : Model.coachLike(u) ? [u.team] : []; }
  /** Oprávnění: smí uživatel psát do chatu kategorie? */
  static canChat(u, team) { return Model.teamsOf(u).includes(team) || (Model.coachLike(u) && team == 'T-' + u.team); }   // 'T-U9' = interní chat trenérů

  /** Zprávy chatu kategorie (vytvoří prázdný chat, pokud ještě neexistuje). */
  static chat(team) { return DB.chats[team] || (DB.chats[team] = []); }
  /** Zprávy od klubu, které uživatel smí vidět (hromadné, trenérské, osobní). */
  static inbox(u) {
    return DB.messages.filter(m => m.fid != u.id &&
      (m.kind == 'all' || (m.kind == 'trainers' && Model.coachLike(u)) || (m.kind == 'user' && m.to == u.id)));
  }
  static unreadChat(u, team) { const s = DB.seen[team] || 0; return Model.chat(team).filter(m => m.id > s && m.fid != u.id).length; }
  static unreadInbox(u)      { const s = DB.seen.inbox || 0; return Model.inbox(u).filter(m => m.id > s).length; }
  /** Konverzace soukromých zpráv: [{id, name, last, unread, msgs}] od nejnovější. */
  static dmThreads(u) {
    const by = {};
    DB.dm.forEach(m => { const pid = m.fid == u.id ? m.tid : m.fid; (by[pid] = by[pid] || {id: pid, name: m.fid == u.id ? m.tn : m.fn, msgs: []}).msgs.push(m); });
    return Object.values(by).map(t => { t.last = t.msgs[t.msgs.length - 1]; t.unread = t.msgs.filter(m => m.fid != u.id && m.id > (DB.seen['dm:' + t.id] || 0)).length; return t; })
      .sort((a, b) => b.last.id - a.last.id);
  }
  static unreadDm(u)         { return Model.dmThreads(u).reduce((s, t) => s + t.unread, 0); }
  static unreadAll(u)        { return Model.unreadDm(u) + Model.teamsOf(u).reduce((s, t) => s + Model.unreadChat(u, t), 0) + (Model.coachLike(u) ? Model.unreadChat(u, 'T-' + u.team) : 0) + Model.unreadInbox(u); }

  /** Docházka hráče v %: základ z minulosti + vše, co trenér označil v aplikaci. */
  /** [počet účastí, počet tréninků] hráče (historie + označené tréninky). */
  static attCount(m) {
    let p = m.a[0], t = m.a[1];
    Object.entries(DB.att).forEach(([k, v]) => { if (k.slice(k.indexOf('|') + 1) == m.n) { t++; if (v == 'P') p++; } });
    return [p, t];
  }
  static attPct(m) {
    const [p, t] = Model.attCount(m);
    return t ? Math.round(p / t * 100) : 0;
  }
  /** Doplní chybějící pole profilu hráče výchozími hodnotami (kvůli importu z Excelu). */
  static fillProfile(m) {
    const d = {full:m.n, no:'', by:'', par:[{n:'',ph:'',em:''}], al:'', lim:'', tn:'', mp:0, gl:0};
    for (const k in d) if (m[k] === undefined) m[k] = d[k];
    return m;
  }
}


/* =====================================================================
   6. Notifs – notifikace (zvonek v hlavičce)
   ===================================================================== */
class Notifs {
  /** Odešle notifikaci přes databázi. Adresát (aud): a všem · T všem trenérům · V vedení ·
      C trenérům kategorie (extra.team) · P rodičům kategorie (extra.team) · K rodičům dítěte (extra.kid) · U jednomu uživateli (extra.to). */
  static send(aud, text, extra) { return Sync.notify(Object.assign({aud, text}, extra)); }
  /** Seznam už databáze omezila jen na notifikace určené tomuto uživateli; vlastní odeslané se nezobrazují. */
  static forUser(n, u) { return n.by != u.id; }
  /** Přečtení se eviduje zvlášť pro každého uživatele (kvůli hromadným zprávám). */
  static isRead(n, u)   { return !!(n.rd && n.rd[u.id]); }
  static markRead(n, u) { if (Notifs.isRead(n, u)) return; (n.rd = n.rd || {})[u.id] = 1; Sync.queueRead(n.id); }
  static markAllRead()  { DB.notifs.forEach(n => { if (Notifs.forUser(n, UI.user)) Notifs.markRead(n, UI.user); }); App.render(); }
  /** Seznam dvojic [notifikace, id] pro uživatele (nejnovější první). */
  static list(u) { return DB.notifs.filter(n => Notifs.forUser(n, u)).map(n => [n, n.id]); }

  /** Klik na notifikaci: označí jako přečtenou a otevře odpovídající záložku (u rodiče i správné dítě). */
  static open(id) {
    const n = DB.notifs.find(x => x.id == id), u = UI.user;
    if (!n) return;
    Notifs.markRead(n, u);
    if (n.tab && TABS[u.r].some(t => t.id == n.tab)) {
      UI.tab = n.tab;
      if (n.sub) UI.chatSub = n.sub;
      if (n.sub == 'dm' && n.by) UI.dmWith = n.by;
      if (u.r == 'p') {
        if (n.team) { UI.chatTeam = n.team; const k = u.kids.find(k => Model.team(k) == n.team); if (k) UI.kid = k; }
        if (n.kid && u.kids.includes(n.kid)) { UI.kid = n.kid; UI.chatTeam = Model.team(n.kid); }
      }
    }
    UI.bell = false;
    App.render();
  }

  /** HTML panelu notifikací. */
  static panel(u, list) {
    return `<div class="panel glass"><div class="pay"><b>Notifikace</b><button class="chip" style="flex:none" onclick="Notifs.markAllRead()">Označit přečtené</button></div>
      ${list.map(([n, i]) => `<div class="nt ${Notifs.isRead(n, u) ? '' : 'un'}" onclick="Notifs.open(${i})">${esc(n.x)}</div>`).join('') || '<div class="mut">Nic nového.</div>'}</div>`;
  }
}


/* =====================================================================
   7. Auth – přihlášení e-mailem a heslem (Supabase Auth)
   Účty zakládá správce v záložce Uživatelé – registrace "zvenku" není povolena.
   ===================================================================== */
class Auth {
  /** HTML přihlašovací obrazovky. */
  static view() {
    if (UI.boot) return `<div class="wrap" style="max-width:440px;padding-top:12vh"><div class="hero"><img class="lg" src="${LOGO}" alt="${CLUB}"><div><b style="font-size:20px">${CLUB}</b><div class="mut">Načítám…</div></div></div></div>`;
    return `<div class="wrap" style="max-width:440px;padding-top:8vh">
      <div class="hero"><img class="lg" src="${LOGO}" alt="${CLUB}"><div><b style="font-size:20px">${CLUB}</b><div class="mut">Klubový systém · pilotní provoz U9</div></div></div>
      <form class="card" onsubmit="Auth.login();return false">
        <b>Přihlášení</b>
        ${SUPABASE_KEY.startsWith('YOUR_') ? '<div class="warn">⚠ V kódu doplňte SUPABASE_KEY (Supabase → Project Settings → API → publishable key).</div>' : ''}
        <label class="mut">E-mail<input id="lg-email" type="email" autocomplete="username" placeholder="vas@email.cz" required></label>
        <label class="mut">Heslo<span class="pw"><input id="lg-pass" type="password" autocomplete="current-password" required><button type="button" class="eye" id="lg-eye" onclick="Auth.peek()" aria-label="Zobrazit heslo" title="Zobrazit / skrýt heslo">👁</button></span></label>
        <label class="keep"><input type="checkbox" id="lg-keep" ${authStorage.keep() ? 'checked' : ''}> Zůstat přihlášený</label>
        ${UI.authMsg ? `<div class="warn">${esc(UI.authMsg)}</div>` : ''}
        <button class="btn ok" id="lg-btn" type="submit" style="width:100%;margin-top:10px">Přihlásit se</button>
        <div class="mut" style="margin-top:10px">Přihlašovací údaje vám vytvořil správce klubu. <a href="#" onclick="Auth.forgot();return false" style="color:var(--ac,#6ee7b7)">Zapomněli jste heslo?</a></div>
        ${UI.authInfo ? `<div class="cg" style="margin-top:6px">${esc(UI.authInfo)}</div>` : ''}
      </form></div>`;
  }

  /** Při startu: je už někdo přihlášený (uložená relace)? */
  static async init() {
    App.render();
    if (/type=recovery/.test(location.hash)) UI.recovery = true;           // návrat z e-mailu „zapomenuté heslo“
    try {
      const { data } = await sb.auth.getSession();
      if (data && data.session) await Sync.boot(data.session.user.id);
      else { UI.boot = false; App.render(); }
    } catch (e) { UI.boot = false; UI.authMsg = 'Nepodařilo se spojit se serverem.'; App.render(); }
    sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && UI.user) Auth.reset(); if (ev === 'PASSWORD_RECOVERY') { UI.recovery = true; if (UI.user) App.render(); } });
    Push.init();
  }

  /** Zobrazí / skryje zadané heslo. */
  static peek() { const i = $('#lg-pass'); if (i) i.type = i.type == 'password' ? 'text' : 'password'; }
  static async login() {
    const email = ($('#lg-email').value || '').trim(), password = $('#lg-pass').value || '';
    try { localStorage.setItem(KEEP_KEY, $('#lg-keep') && !$('#lg-keep').checked ? '0' : '1'); } catch (e) {}
    if (!email || !password) return;
    $('#lg-btn').disabled = true;
    const { data, error } = await sb.auth.signInWithPassword({email, password});
    if (error || !data || !data.user) {
      UI.authMsg = error && /invalid login|credentials/i.test(error.message) ? 'Nesprávný e-mail nebo heslo.'
                 : error && /api key/i.test(error.message) ? 'Neplatný SUPABASE_KEY v kódu aplikace.' : (error ? error.message : 'Přihlášení se nezdařilo.');
      UI.skipKeep = ['lg-pass'];
      return App.render();
    }
    UI.authMsg = ''; UI.authInfo = '';
    await Sync.boot(data.user.id);
  }

  /** Pošle e-mail s odkazem pro nastavení nového hesla. */
  static async forgot() {
    const email = ($('#lg-email').value || '').trim();
    if (!email) { UI.authMsg = 'Napište výše svůj e-mail a klikněte znovu na „Zapomněli jste heslo?“.'; UI.authInfo = ''; UI.skipKeep = ['lg-pass']; return App.render(); }
    const { error } = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname});
    UI.authMsg = error ? (/rate|seconds/i.test(error.message) ? 'Příliš brzy – zkuste to za minutu.' : error.message) : '';
    UI.authInfo = error ? '' : 'Pokud účet s tímto e-mailem existuje, poslali jsme na něj odkaz pro nastavení nového hesla.';
    UI.skipKeep = ['lg-pass'];
    App.render();
  }

  static async logout() { try { await sb.auth.signOut(); } catch (e) {} Auth.reset(); }

  /** Vyčistí paměť aplikace a vrátí přihlašovací obrazovku. */
  static reset() {
    Sync.stop();
    Object.assign(DB, {users:{}, members:[], docs:{}, events:[], results:[], payItems:[], plan:[], messages:[], chats:{}, notifs:[], links:[], settings:{}, dm:[], dmContacts:[],
                       att:{}, coachAtt:{}, coachNm:{}, coachEv:{}, nominations:{}, carpool:{}, responses:{}, notes:{}, seen:{}});
    UI.user = null; UI.asTeam = ''; UI.imp = null; UI.recovery = false; UI.more = false; UI.bell = false; UI.modal = null; UI.profile = false; UI.profMsg = ''; UI.pkSel = {}; UI.player = ''; UI.boot = false; UI.kid = ''; UI.editUser = ''; UI.dmWith = ''; UI.dmSearch = ''; UI.ai = null;
    UI.skipKeep = ['lg-pass', 'lg-email'];
    App.render();
  }
}


/* =====================================================================
   7b. Sync – načítání a ukládání dat do Supabase + Realtime
   Pravidlo: akce v modulech nejdřív upraví paměť (DB), pak zavolají Sync.* a překreslí stránku.
   Když uložení selže, ukáže se hlášení a data se znovu načtou ze serveru.
   ===================================================================== */
class Sync {
  static me = '';                 // id přihlášeného uživatele
  static ch = null;               // kanál Realtime
  static pending = 0;             // rozepsané / probíhající zápisy (během nich se nenačítá zpět ze serveru)
  static timers = {};             // odložené ukládání karet hráčů (podle id hráče)
  static reloads = new Set();     // co je třeba znovu načíst
  static reloadTimer = 0;
  static readQ = new Set();       // notifikace čekající na zapsání "přečteno"
  static readTimer = 0;
  static subscribed = false;

  // ---------- start a konec ----------
  /** Po přihlášení: načte data, nastaví výchozí pohled a spustí Realtime. */
  static async boot(uid) {
    UI.boot = true; Sync.me = uid; App.render();
    try {
      await Sync.loadAll();
      const u = DB.users[uid];
      if (!u) throw new Error('Váš účet nemá profil. Kontaktujte správce klubu.');
      UI.user = u; UI.tab = TABS[u.r][0].id; UI.chatSub = 'team'; UI.bell = false; UI.player = ''; UI.attEvent = 0; UI.matchEvent = 0; UI.modal = null;
      if (u.r == 'p') { UI.kid = u.kids[0] || ''; UI.chatTeam = UI.kid ? Model.team(UI.kid) : ''; }
      Sync.subscribe();
    } catch (e) {
      console.error(e);
      try { await sb.auth.signOut(); } catch (x) {}
      Auth.reset(); UI.authMsg = 'Načtení dat se nezdařilo: ' + (e.message || e);
    }
    UI.boot = false; App.render();
  }

  static stop() {
    if (Sync.ch) { try { sb.removeChannel(Sync.ch); } catch (e) {} Sync.ch = null; }
    Object.values(Sync.timers).forEach(clearTimeout); Sync.timers = {};
    clearTimeout(Sync.reloadTimer); Sync.reloads.clear(); Sync.readQ.clear(); Sync.pending = 0; Sync.subscribed = false;
  }

  static async loadAll() {
    await Sync.loaders.teams();                                     // kategorie (pro výběry a správce)
    await Sync.loaders.players();                                   // ostatní části potřebují jména hráčů
    await Promise.all(Object.entries(Sync.loaders).filter(([k]) => k != 'players' && k != 'teams').map(([, f]) => f()));
  }

  // ---------- načítání ----------
  /** Stránkované načtení celé tabulky (Supabase vrací max. 1000 řádků na dotaz). */
  static async fetchAll(table, build) {
    const out = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await build(sb.from(table).select('*')).range(from, from + 999);
      if (error) throw new Error(table + ': ' + error.message);
      out.push(...data);
      if (data.length < 1000) break;
    }
    return out;
  }
  static async last(table, n, col) {          // posledních n řádků v chronologickém pořadí
    const { data, error } = await sb.from(table).select('*').order(col || 'id', {ascending: false}).limit(n);
    if (error) throw new Error(table + ': ' + error.message);
    return data.reverse();
  }

  static loaders = {
    /** Kategorie klubu (tabulka teams; když tabulka ještě není, zůstanou výchozí) */
    teams: async () => {
      const { data, error } = await sb.from('teams').select('*').order('sort').order('name');
      if (!error && data.length) CONFIG.planner.teams = data.map(t => t.name);
    },
    /** Veřejná nastavení klubu: číslo účtu pro platby, VAPID klíč pro push */
    settings: async () => {
      const { data, error } = await sb.from('settings').select('*');
      if (error) return;
      DB.settings = Object.fromEntries(data.map(r => [r.key, r.value]));
      CONFIG.account = DB.settings.account || CONFIG.account;
    },
    /** Hráči + platby + soukromé poznámky trenéra → DB.members, DB.payItems, DB.docs */
    players: async () => {
      const [pl, items, pay, pc] = await Promise.all([
        Sync.fetchAll('players', q => q.order('team').order('full_name').order('id')),
        Sync.fetchAll('pay_items', q => q.order('sort').order('id')),
        Sync.fetchAll('player_payments', q => q.order('player_id').order('item_id')),
        Sync.fetchAll('player_coach', q => q.order('player_id'))]);
      DB.payItems = items.map(i => ({id: i.id, n: i.name, a: i.amount}));
      const paid = new Set(pay.filter(x => x.paid).map(x => x.player_id + '|' + x.item_id));
      const note = Object.fromEntries(pc.map(x => [x.player_id, x.trainer_note]));
      DB.docs = {};
      DB.members = pl.map(p => {
        DB.docs[p.short_name] = p.doc_status;
        const par = Array.isArray(p.parents) && p.parents.length ? p.parents.map(x => ({n: x.n || '', ph: x.ph || '', em: x.em || ''})) : [{n:'', ph:'', em:''}];
        return {id: p.id, n: p.short_name, t: p.team, a: [p.att_present, p.att_total], p: DB.payItems.map(i => paid.has(p.id + '|' + i.id) ? 1 : 0), vs: p.vs,
                full: p.full_name, no: p.jersey_no == null ? '' : p.jersey_no, by: p.birth_year == null ? '' : p.birth_year, par,
                al: p.allergies, lim: p.limitations, tn: note[p.id] || '', mp: p.matches, gl: p.goals, ph: p.photo || ''};
      });
    },
    /** Účty + vazby rodič ↔ dítě → DB.users (vedení vidí všechny, ostatní jen sebe) */
    people: async () => {
      const [pr, lk] = await Promise.all([Sync.fetchAll('profiles', q => q.order('name').order('id')), Sync.fetchAll('parent_players', q => q.order('parent_id').order('player_id'))]);
      DB.links = lk;
      DB.users = {};
      pr.forEach(p => DB.users[p.id] = {id: p.id, r: p.role, name: p.name || p.email || '(bez jména)', email: p.email || '', phone: p.phone || '', mc: !!p.must_change_password, role: CONFIG.roles[p.role],
        consent: !('consent_at' in p) || !!p.consent_at, pc: !!p.photo_consent,      // (bez sloupce = SQL ještě nespuštěno → souhlas se nevyžaduje)
        team: p.role == 'a' ? (UI.asTeam || CONFIG.planner.teams[0] || '') : (p.team || ''),
        kids: lk.filter(l => l.parent_id == p.id).map(l => (Model.byId(l.player_id) || {}).n).filter(Boolean).sort()});
      if (UI.user && DB.users[Sync.me]) {                              // přihlášený: obnovit odkaz a případně změněné děti
        UI.user = DB.users[Sync.me];
        if (UI.user.r == 'p' && !UI.user.kids.includes(UI.kid)) { UI.kid = UI.user.kids[0] || ''; UI.chatTeam = UI.kid ? Model.team(UI.kid) : ''; }
      }
    },
    /** Události zobrazovaného týdne */
    events: async () => {
      const a = Util.iso(Util.dayDate(0)), b = Util.iso(Util.dayDate(6));
      try { await sb.rpc('sync_plan_events', {week_start: a}); } catch (e) { console.warn('sync_plan_events', e); }   // tréninky vzniklé z rozvrhu hřišť (idempotentní)
      const ev = await Sync.fetchAll('events', q => q.gte('event_date', a).lte('event_date', b).order('id'));
      DB.events = ev.map(e => ({id: e.id, k: e.kind, tm: e.team, d: Util.dayIndex(e.event_date), t: e.time, pl: e.place, m: e.meet, c: e.coach, o: e.opponent || '', x: e.cancelled ? 1 : 0}));
    },
    results: async () => {
      const { data, error } = await sb.from('results').select('*').order('played_on', {ascending: false}).order('id', {ascending: false}).limit(60);
      if (error) throw new Error('results: ' + error.message);
      DB.results = data.map(r => ({tm: r.team, d: Util.short(r.played_on), o: r.opponent, h: r.home ? 1 : 0, s: [r.score_us, r.score_them], g: r.scorers || {}}));
    },
    plan: async () => {
      const pl = await Sync.fetchAll('plan', q => q.order('id'));
      DB.plan = pl.map(b => ({id: b.id, d: b.day, f: b.field, tm: b.team, s: b.start_min, e: b.end_min}));
    },
    /** Docházka + omluvy + spolujízda → DB.att, DB.responses, DB.carpool */
    attendance: async () => {
      const rows = await Sync.fetchAll('attendance', q => q.order('id'));
      DB.att = {}; DB.responses = {}; DB.carpool = {};
      rows.forEach(r => { const m = Model.byId(r.player_id); if (m) Sync.applyAtt(r, m); });
    },
    /** Stálá absence hráčů: {idHráče: [dny 0=Po…6=Ne]} (když tabulka ještě není, zůstane prázdné). */
    pabs: async () => {
      const { data, error } = await sb.from('player_absence').select('*');
      DB.pabs = {}; if (error || !data) return;
      data.forEach(r => (DB.pabs[r.player_id] = DB.pabs[r.player_id] || []).push(r.weekday));
    },
    /** Moje nastavení upozornění. */
    prefs: async () => {
      const { data, error } = await sb.from('user_prefs').select('*');
      DB.prefs = (!error && data && data[0] && data[0].notif) || {};
    },
    coach: async () => {
      const rows = await Sync.fetchAll('coach_attendance', q => q.order('event_id').order('coach_id')), dt = {};
      const miss = [...new Set(rows.filter(r => !r.ev_date).map(r => r.event_id))];       // starší záznamy bez data: dohledat z událostí
      for (let i = 0; i < miss.length; i += 100) {
        try { const q = await sb.from('events').select('id,kind,event_date').in('id', miss.slice(i, i + 100)); (q.data || []).forEach(e => dt[e.id] = e); } catch (e) {}
      }
      DB.coachAtt = {}; DB.coachNm = {}; DB.coachEv = {};
      rows.forEach(r => { const k = r.coach_id + '|' + r.event_id, e = dt[r.event_id] || {}; DB.coachAtt[k] = r.state; DB.coachNm[k] = Util.surname(r.coach_name);
        DB.coachEv[k] = {k: r.ev_kind || e.kind || 't', d: r.ev_date || e.event_date || ''}; });
    },
    noms: async () => {
      const rows = await Sync.fetchAll('nominations', q => q.order('event_id').order('player_id'));
      DB.nominations = {};
      rows.forEach(r => { const m = Model.byId(r.player_id); if (m) (DB.nominations[r.event_id] = DB.nominations[r.event_id] || []).push(m.n); });
    },
    notes: async () => {
      const rows = await Sync.fetchAll('notes', q => q.order('id'));
      DB.notes = {};
      rows.forEach(r => { const m = Model.byId(r.player_id); if (!m) return; const d = new Date(r.created_at);
        (DB.notes[m.n] = DB.notes[m.n] || []).push({g: r.tag, x: r.body, d: `${d.getDate()}.${d.getMonth() + 1}.`}); });
    },
    chat: async () => {
      const rows = await Sync.last('chat_messages', 300);
      DB.chats = {}; rows.forEach(r => Model.chat(r.team).push(Sync.chatRow(r)));
    },
    /** Soukromé zprávy a seznam lidí, kterým smí uživatel psát (když tabulka ještě není, zůstane prázdné). */
    dm: async () => {
      try {
        const rows = await Sync.last('direct_messages', 500);
        DB.dm = rows.map(r => ({id: r.id, fid: r.from_id, tid: r.to_id, fn: r.from_name, tn: r.to_name, x: r.body, t: Util.stamp(r.created_at)}));
      } catch (e) { DB.dm = []; }
      DB.dmErr = '';
      try {
        const c = await sb.rpc('dm_contacts'); if (c.error) throw c.error;
        DB.dmContacts = Array.isArray(c.data) ? c.data : [];
      } catch (e) { DB.dmContacts = []; DB.dmErr = String((e && e.message) || e); }
    },
    club: async () => {
      const rows = await Sync.last('club_messages', 300);
      DB.messages = rows.map(r => ({id: r.id, fid: r.sender_id, f: r.sender_name, role: r.sender_role, kind: r.kind, to: r.recipient_id, s: r.subject, x: r.body, t: Util.stamp(r.created_at)}));
    },
    notifs: async () => {
      const [rows, reads] = await Promise.all([
        sb.from('notifications').select('*').order('id', {ascending: false}).limit(100),
        Sync.fetchAll('notification_reads', q => q.order('notif_id'))]);
      if (rows.error) throw new Error('notifications: ' + rows.error.message);
      const rd = new Set(reads.map(r => r.notif_id));
      DB.notifs = rows.data.map(n => ({id: n.id, aud: n.aud, to: n.to_user, team: n.team, kid: n.kid, x: n.text, tab: n.tab, sub: n.sub, c: n.cnt, by: n.by_user, rd: rd.has(n.id) ? {[Sync.me]: 1} : {}}));
    },
    seen: async () => {
      const rows = await Sync.fetchAll('read_state', q => q.order('key'));
      DB.seen = {}; rows.forEach(r => DB.seen[r.key] = r.cnt);
    }
  };

  static chatRow(r) { return {id: r.id, fid: r.sender_id, f: r.sender_name, role: r.sender_role, x: r.body, t: Util.stamp(r.created_at)}; }

  /** Jeden řádek docházky → DB.att (značka trenéra), DB.responses (omluva rodiče), DB.carpool */
  static applyAtt(r, m) {
    const ke = r.event_id + '|' + m.n, kr = m.n + '|' + r.event_id;
    if (r.state) DB.att[ke] = r.state; else delete DB.att[ke];
    if (r.response) DB.responses[kr] = {s: r.response, r: r.reason || '', x: r.note || ''}; else delete DB.responses[kr];
    if (r.carpool) DB.carpool[kr] = r.carpool; else delete DB.carpool[kr];
  }

  // ---------- Realtime ----------
  /** Která tabulka při změně znovu načte které části paměti. */
  static watch = {
    teams: ['teams'], settings: ['settings'], events: ['events'], results: ['results'], plan: ['plan'], nominations: ['noms'], club_messages: ['club'], notifications: ['notifs'],
    coach_attendance: ['coach'], direct_messages: ['dm'], player_absence: ['pabs'], user_prefs: ['prefs'], players: ['players', 'people'], player_payments: ['players'], parent_players: ['people'], profiles: ['people']
  };

  static subscribe() {
    Sync.stop();
    const ch = sb.channel('tj-sokol-' + Sync.me);
    ch.on('postgres_changes', {event: 'INSERT', schema: 'public', table: 'chat_messages'}, p => Sync.onChat(p.new));       // chat: hned
    ch.on('postgres_changes', {event: '*', schema: 'public', table: 'attendance'}, p => Sync.onAtt(p));                      // docházka a omluvy: hned
    Object.entries(Sync.watch).forEach(([table, names]) => ch.on('postgres_changes', {event: '*', schema: 'public', table}, () => Sync.queueReload(names)));
    ch.subscribe(status => {
      if (status == 'SUBSCRIBED') { if (Sync.subscribed) Sync.queueReload(Object.keys(Sync.loaders)); Sync.subscribed = true; }   // po výpadku spojení dočíst vše
    });
    Sync.ch = ch;
  }

  static onChat(r) {
    const list = Model.chat(r.team);
    if (list.some(m => m.id == r.id)) return;                        // už máme (vlastní zpráva)
    list.push(Sync.chatRow(r));
    App.refresh();
  }

  static onAtt(p) {
    if (p.eventType == 'DELETE') return Sync.queueReload(['attendance']);
    const r = p.new, m = Model.byId(r.player_id);
    if (!m) return Sync.queueReload(['players', 'attendance']);
    Sync.applyAtt(r, m);
    App.refresh();
  }

  /** Odložené znovunačtení částí paměti (sloučí rychlé změny; počká, až doběhnou vlastní zápisy). */
  static queueReload(names) {
    names.forEach(n => Sync.reloads.add(n));
    clearTimeout(Sync.reloadTimer);
    Sync.reloadTimer = setTimeout(Sync.flushReloads, 350);
  }
  static async flushReloads() {
    if (!UI.user) return;
    if (Sync.pending > 0) { Sync.reloadTimer = setTimeout(Sync.flushReloads, 500); return; }
    const names = [...Sync.reloads]; Sync.reloads.clear();
    try {
      if (names.includes('players')) await Sync.loaders.players();
      await Promise.all(names.filter(n => n != 'players').map(n => Sync.loaders[n]()));
    } catch (e) { console.error(e); }
    App.refresh();
  }

  // ---------- ukládání ----------
  /** Provede zápis do databáze; při chybě ukáže hlášení a znovu načte data. Vrací výsledek, nebo null. */
  static async write(label, query) {
    Sync.pending++;
    try {
      const r = await query;
      if (r.error) throw r.error;
      return r;
    } catch (e) {
      console.error(label, e);
      Sync.toast(`${label}: ${e.message || e}`);
      Sync.queueReload(Object.keys(Sync.loaders));
      return null;
    } finally { Sync.pending--; }
  }

  static toast(msg, ok) {
    UI.toast = msg; UI.toastOk = !!ok; App.refresh();
    clearTimeout(Sync.toastTimer);
    Sync.toastTimer = setTimeout(() => { UI.toast = ''; App.refresh(); }, 5500);
  }

  static notify(n) {
    return Sync.write('Notifikaci se nepodařilo odeslat', sb.from('notifications').insert({
      aud: n.aud, to_user: n.to || null, team: n.team || null, kid: n.kid || null, text: n.text, tab: n.tab || null, sub: n.sub || null}));
  }

  /** Odpověď rodiče (účast / omluva / spolujízda) nebo značka trenéra – jeden řádek hráč × událost. */
  static saveAttendance(kid, eventId, fields) {
    const m = Model.member(kid);
    return Sync.write('Docházku se nepodařilo uložit', sb.from('attendance').upsert(
      Object.assign({event_id: +eventId, player_id: m.id}, fields), {onConflict: 'event_id,player_id'}));
  }

  /** Uloží kartu hráče (odloženě, aby se neukládal každý znak). */
  static savePlayer(id, now) {
    if (!Sync.timers[id]) Sync.pending++;                            // dokud je zápis rozepsaný, nenačítá se zpět ze serveru
    clearTimeout(Sync.timers[id]);
    Sync.timers[id] = setTimeout(async () => {
      delete Sync.timers[id];
      try {
        const m = Model.byId(id);
        if (m) {
          await Sync.write('Hráče se nepodařilo uložit', sb.from('players').update({
            full_name: m.full, jersey_no: m.no === '' ? null : m.no, birth_year: m.by === '' ? null : m.by, allergies: m.al, limitations: m.lim,
            matches: m.mp, goals: m.gl, photo: m.ph || '', doc_status: DB.docs[m.n] || 'wait', parents: m.par}).eq('id', id));
          await Sync.write('Poznámku trenéra se nepodařilo uložit', sb.from('player_coach').upsert({player_id: id, trainer_note: m.tn || ''}));
        }
      } catch (e) { console.error(e); }
      finally { Sync.pending--; }                                    // vždy uvolnit, jinak by se přestala načítat data ze serveru
    }, now ? 0 : 600);
  }

  static queueRead(id) {
    Sync.readQ.add(id);
    clearTimeout(Sync.readTimer);
    Sync.readTimer = setTimeout(Sync.flushReads, 400);
  }
  static async flushReads() {
    const ids = [...Sync.readQ]; Sync.readQ.clear();
    if (!ids.length || !UI.user) return;
    await Sync.write('Přečtení se nepodařilo uložit', sb.from('notification_reads').upsert(
      ids.map(id => ({notif_id: id, user_id: Sync.me})), {onConflict: 'notif_id,user_id', ignoreDuplicates: true}));
  }
  /** Zapamatuje si, kam až uživatel zprávy přečetl (chat kategorie = klíč týmu, zprávy od klubu = "inbox"). */
  static setSeen(key, id) {
    if (!id || (DB.seen[key] || 0) >= id) return;
    DB.seen[key] = id;
    Sync.write('Přečtení se nepodařilo uložit', sb.from('read_state').upsert({user_id: Sync.me, key, cnt: id}, {onConflict: 'user_id,key'}));
  }

  /** Volání Edge Function admin-users (zakládání / úprava / mazání účtů). */
  static async admin(body) {
    const { data, error } = await sb.functions.invoke('admin-users', {body});
    if (error) {
      let msg = error.message || '';
      try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch (e) {}
      if (/FunctionsFetchError|FunctionsRelayError|Failed to send|not found/i.test((error.name || '') + ' ' + msg))
        msg = 'Funkce admin-users není nasazená (viz admin-users-edge-function.ts).';
      throw new Error(msg || 'Akce se nezdařila.');
    }
    if (data && data.error) throw new Error(data.error);
    return data;
  }
}

/* ---------------------------------------------------------------------
   Calendar – kalendář dítěte, účast, omluvy, spolujízda, historie zápasů (RODIČ)
   --------------------------------------------------------------------- */
class Calendar {
  /** Záložka "Přehled": nadcházející události + odehrané zápasy kategorie dítěte. */
  static view() {
    const team = Model.team(UI.kid);
    return `<div class="col"><h2 style="margin-top:0">📅 Nadcházející · ${UI.kid} (${team})</h2>
      ${Model.eventsOf(team).map(e => Calendar.eventCard(e)).join('')}${Calendar.history(team)}</div>`;
  }

  /** Karta jedné události (trénink / zápas / zrušeno) s tlačítky účasti. */
  static eventCard(e) {
    const k = UI.kid + '|' + e.id, r = DB.responses[k], cl = e.x ? 'x' : e.k;
    return `<div class="card ev ${cl}">
      <div class="pay"><b>${e.k == 'z' ? '🏆 Zápas vs. ' + e.o : '⚽ Trénink'}</b><span class="pill ${cl}">${e.x ? 'Zrušeno' : e.k == 'z' ? 'Zápas' : 'Trénink'}</span></div>
      <div class="mut">🕒 ${Util.date(e.d)}, ${e.t} · 📍 ${e.pl}<br>🤝 Sraz: ${e.m} · 👤 ${esc(Model.coachSurnames(e))}</div>
      ${e.x ? '' : `<div class="row" style="margin-top:10px">
          <button class="btn ${r && r.s == 'y' ? 'ok' : ''}" onclick="Calendar.attend('${Util.q(k)}')">✔ Zúčastní se</button>
          <button class="btn ${r && r.s == 'n' ? 'no' : ''}" onclick="Calendar.openExcuse('${Util.q(k)}')">✖ Omluvit se</button></div>
        ${r && r.s == 'n' ? `<div class="mut">Omluven: ${r.r}${r.x ? ' – ' + esc(r.x) : ''}</div>` : ''}
        ${e.k == 'z' ? Calendar.carpoolSelect(k) : ''}`}
    </div>`;
  }

  /** Výběr spolujízdy u zápasu. */
  static carpoolSelect(k) {
    const c = DB.carpool[k];
    return `<select onchange="Calendar.setCarpool('${Util.q(k)}',this.value)"><option value="">🚗 Spolujízda…</option>
      ${[1,2,3,4].map(n => `<option value="o${n}" ${c == 'o' + n ? 'selected' : ''}>Mám volná místa v autě (${n})</option>`).join('')}
      <option value="s" ${c == 's' ? 'selected' : ''}>Hledám odvoz</option></select>`;
  }

  /** Odehrané zápasy kategorie + bilance a góly vybraného dítěte. */
  static history(team) {
    const L = DB.results.filter(r => r.tm == team);
    const w = L.filter(r => r.s[0] > r.s[1]).length, d = L.filter(r => r.s[0] == r.s[1]).length;
    const goals = L.reduce((a, r) => a + (r.g[UI.kid] || 0), 0);
    return `<h2>🏁 Odehrané zápasy</h2>
      <div class="card"><div class="pay"><span>Bilance týmu ${team}</span><b>${w}V · ${d}R · ${L.length - w - d}P</b></div><div class="mut">Branky ${UI.kid}: ${goals}</div></div>
      ${L.map(r => {
        const c = r.s[0] > r.s[1] ? ['ok','V'] : r.s[0] == r.s[1] ? ['wa','R'] : ['no','P'], k = r.g[UI.kid];
        return `<div class="card"><div class="pay"><div><b>${r.h ? CLUB + ' – ' + r.o : r.o + ' – ' + CLUB}</b>
          <div class="mut">${r.d} · ${r.h ? 'doma' : 'venku'}${k ? ` · ⚽ ${UI.kid} ${k}×` : ''}</div></div>
          <span class="pill ${c[0]}">${r.h ? r.s[0] + ':' + r.s[1] : r.s[1] + ':' + r.s[0]} ${c[1]}</span></div></div>`;
      }).join('')}`;
  }

  // ----- akce -----
  static attend(k) {
    const [kid, id] = k.split('|');
    DB.responses[k] = {s:'y'}; App.render();
    Sync.saveAttendance(kid, id, {response:'y', reason:null, note:null});
  }
  static setCarpool(k, v) {
    const [kid, id] = k.split('|');
    if (v) DB.carpool[k] = v; else delete DB.carpool[k];
    App.render();
    Sync.saveAttendance(kid, id, {carpool: v || null});
  }
  static openExcuse(k)    { UI.modal = k; UI.reason = ''; App.render(); }
  static pickReason(r)    { UI.reason = r; App.render(); }
  static closeModal()     { UI.modal = null; App.render(); }

  /** Okno omluvy: důvod + poznámka pro trenéra. */
  static excuseModal() {
    return `<div class="mo" onclick="if(event.target==this)Calendar.closeModal()"><div class="card">
      <b>Omluvit se – ${UI.modal.split('|')[0]}</b>
      <div class="row" style="margin:10px 0">${CONFIG.excuseReasons.map(r => `<button class="chip ${UI.reason == r ? 'on' : ''}" onclick="Calendar.pickReason('${r}')">${r}</button>`).join('')}</div>
      <textarea id="excuse-note" rows="2" placeholder="Poznámka pro trenéra (volitelné)"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn" onclick="Calendar.closeModal()">Zrušit</button><button class="btn ok" onclick="Calendar.submitExcuse()">Odeslat omluvu</button></div></div></div>`;
  }

  /** Uloží omluvu do databáze a pošle notifikaci trenérům kategorie dítěte. */
  static submitExcuse() {
    if (!UI.reason) return alert('Vyberte důvod');
    const k = UI.modal, [kid, id] = k.split('|'), e = Model.event(id), reason = UI.reason, note = $('#excuse-note').value;
    DB.responses[k] = {s:'n', r:reason, x:note};
    Sync.saveAttendance(kid, id, {response:'n', reason, note: note || null});                 // uloží se a ostatním přijde Realtime
    Notifs.send('C', `🩹 Omluva: ${kid} – ${reason} (${Util.date(e.d)})`, {team: Model.team(kid), tab:'att'});   // notifikace trenérům kategorie
    UI.modal = null;
    App.render();
  }
}


/* ---------------------------------------------------------------------
   Payments – dokumenty a platby dítěte (RODIČ) + přehled plateb a import (VEDENÍ)
   --------------------------------------------------------------------- */
class Payments {
  // ===== pohled rodiče =====
  /** Záložka "Dokumenty & platby": zdravotní prohlídka + příspěvky s QR kódem. */
  static parentView() {
    const m = Model.member(UI.kid), st = DB.docs[UI.kid] || 'wait', L = CONFIG.docStatus[st], d = Model.debt(m);
    return `<div class="g2"><div><h2>Dokumenty</h2>
      <div class="card"><div class="pay"><b>🩺 Zdravotní prohlídka</b><span class="pill ${L[1]}">${L[0]}</span></div>
        <div class="mut">${UI.kid}${st == 'ok' ? ' · platí do 12. 3. 2027' : st == 'exp' ? ' · platnost vypršela, nahrajte novou' : ''}</div>
        <input type="file" onchange="Payments.uploadDoc()">
        <div class="mut" style="margin-top:6px">Po nahrání se stav změní na „Čeká na schválení“. Schvaluje trenér.</div></div></div>
      <div><h2>Platby ${d ? `<span class="pill no">dluh ${d} Kč</span>` : '<span class="pill ok">vše zaplaceno</span>'}</h2>
      ${DB.payItems.map((x, i) => `<div class="card"><div class="pay"><div><b>${x.n}</b><div class="mut">${x.a} Kč</div></div>
        ${m.p[i] ? '<span class="pill ok">✔ Zaplaceno</span>' : `<button class="btn no" onclick="Payments.showQr(${i})">Platební údaje</button>`}</div>
        ${UI.qr === i && !m.p[i] ? `<div style="margin-top:10px"><div class="mut">Částka: <b>${x.a} Kč</b></div>
          <div class="mut">Účet: <b>${CONFIG.account ? esc(CONFIG.account) : 'doplní správce klubu'}</b></div>
          <div class="mut">Variabilní symbol: <b>${m.vs || '–'}</b></div>
          <div class="mut">Zpráva pro příjemce: <b>${esc(m.full || m.n)} – ${esc(x.n)}</b></div>
          ${Payments.qr(m, x)}
          <div class="mut" style="margin-top:6px">Po připsání platby ji vedení klubu označí jako zaplacenou.</div></div>` : ''}</div>`).join('')}</div></div>`;
  }
  /** Český IBAN z čísla účtu "předčíslí-číslo/banka". */
  static iban(acc) {
    const q = String(acc || '').match(/^(?:(\d{1,6})-)?(\d{2,10})\/(\d{4})$/); if (!q) return '';
    const bban = q[3] + (q[1] || '').padStart(6, '0') + q[2].padStart(10, '0'), n = bban + '123500';   // CZ = 12 35, kontrolní číslice 00
    let r = 0; for (const ch of n) r = (r * 10 + +ch) % 97;
    return 'CZ' + String(98 - r).padStart(2, '0') + bban;
  }
  /** QR platba (český standard SPD) – vykreslí se, jen když je zadané číslo účtu a načtená knihovna. */
  static qr(m, x) {
    const iban = Payments.iban(CONFIG.account);
    if (!iban || !window.qrcode) return '';
    const ascii = t => String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9 .,\-]/g, '').toUpperCase().slice(0, 60);
    const spd = `SPD*1.0*ACC:${iban}*AM:${x.a.toFixed(2)}*CC:CZK*MSG:${ascii((m.full || m.n) + ' ' + x.n)}` + (m.vs ? `*X-VS:${m.vs}` : '');
    const q = window.qrcode(0, 'M'); q.addData(spd); q.make();
    return `<div style="margin-top:8px;background:#fff;padding:8px;border-radius:12px;display:inline-block;line-height:0">${q.createSvgTag(4, 0)}</div><div class="mut">Naskenujte v bankovní aplikaci.</div>`;
  }
  static uploadDoc() {                                                       // nahrání dokumentu → čeká na schválení
    DB.docs[UI.kid] = 'wait'; App.render();
    Sync.write('Stav dokumentu se nepodařilo uložit', sb.rpc('upload_doc', {pid: Model.member(UI.kid).id}));
  }
  static showQr(i)      { UI.qr = UI.qr === i ? null : i; App.render(); }

  // ===== pohled vedení =====
  /** Členové po aplikování filtrů (stav platby, tým, hledání podle jména). */
  static filtered() {
    return DB.members.filter(m =>
      (UI.payFilter == 'all' || (UI.payFilter == 'dl' ? Model.debt(m) > 0 : Model.debt(m) == 0)) &&
      (UI.teamFilter == 'all' || m.t == UI.teamFilter) &&
      Util.norm(m.n + ' ' + (m.full || '')).includes(Util.norm(UI.search)));
  }

  /** Záložka "Platby": souhrn, import z Excelu, hledání, filtry, seznam členů. */
  static managementView() {
    let total = 0, got = 0;
    DB.members.forEach(m => DB.payItems.forEach((x, i) => { total += x.a; if (m.p[i]) got += x.a; }));
    const L = Payments.filtered(), debtors = L.filter(m => Model.debt(m) > 0).length;
    return `<div class="card"><div class="pay"><span>Vybráno</span><b>${got} / ${total} Kč</b></div>
        <div class="bar"><i style="width:${Math.round(got / total * 100)}%"></i></div>
        <div class="mut">Nedoplatky: ${total - got} Kč · ${DB.members.filter(m => Model.debt(m) > 0).length} z ${DB.members.length} členů má dluh</div></div>
      <div class="card"><b>Import z Excelu</b>
        <div class="mut">Sloupce: „Jméno“, volitelně „Tým“, další = příspěvky (např. „Dresy (600)“). Zaplaceno = ano / 1 / x / ✔.</div>
        <input type="file" accept=".xlsx,.xls,.csv" onchange="Payments.importExcel(this)">
        ${UI.importMsg ? `<div class="mut cg">${UI.importMsg}</div>` : ''}</div>
      <input id="pay-search" type="search" placeholder="🔍 Hledat hráče…" value="${esc(UI.search)}" oninput="Payments.setSearch(this.value)">
      <div class="row" style="margin:6px 0">${['all', ...new Set(DB.members.map(m => m.t))].map(t => `<button class="chip ${UI.teamFilter == t ? 'on' : ''}" onclick="Payments.setTeam('${t}')">${t == 'all' ? 'Všechny týmy' : t}</button>`).join('')}</div>
      <div class="row" style="margin-bottom:8px">${[['all','Všichni'],['dl','Dlužníci'],['ok','Zaplaceno']].map(([k, l]) => `<button class="chip ${UI.payFilter == k ? 'on' : ''}" onclick="Payments.setFilter('${Util.q(k)}')">${l}</button>`).join('')}</div>
      ${debtors ? `<button class="btn no" style="width:100%;margin-bottom:10px" onclick="Payments.remindFiltered()">📨 Poslat výzvu všem dlužníkům (${debtors})</button>` : ''}
      <div class="g2">${L.map(m => Payments.memberCard(m)).join('')}</div>${L.length ? '' : '<div class="card mut">Nikdo nenalezen.</div>'}`;
  }

  /** Karta člena v přehledu plateb: klepnutím na příspěvek se změní stav. */
  static memberCard(m) {
    const d = Model.debt(m);
    return `<div class="card"><div class="pay"><div><b>${m.n}</b> <span class="mut">${m.t}${m.vs ? ' · VS ' + m.vs : ''}</span></div>${d ? `<b class="cr">dluh ${d} Kč</b>` : '<b class="cg">✔ vše</b>'}</div>
      <div class="row" style="margin-top:8px">${DB.payItems.map((x, i) => `<button class="chip ${m.p[i] ? 'ok' : 'no'}" style="background:rgba(var(--c),.18)" onclick="Payments.toggle('${m.id}',${i})">${m.p[i] ? '✔' : '✗'} ${x.n} · ${x.a}</button>`).join('')}</div>
      ${d ? `<button class="btn" style="width:100%;margin-top:8px" onclick="Payments.remind(['${Util.q(m.n)}'])">Poslat upomínku</button>` : ''}</div>`;
  }

  // ----- akce vedení -----
  static toggle(pid, i) {
    const m = Model.byId(pid); m.p[i] = m.p[i] ? 0 : 1; App.render();
    Sync.write('Platbu se nepodařilo uložit', sb.from('player_payments').upsert(
      {player_id: pid, item_id: DB.payItems[i].id, paid: !!m.p[i]}, {onConflict: 'player_id,item_id'}));
  }
  static setTeam(t)      { UI.teamFilter = t; App.render(); }
  static setFilter(k)    { UI.payFilter = k; App.render(); }
  static setSearch(v) {                      // hledání: po překreslení vrátí kurzor na konec pole
    UI.search = v; App.render();
    const i = $('#pay-search'); i.focus(); i.setSelectionRange(i.value.length, i.value.length);
  }
  static remindFiltered() { Payments.remind(Payments.filtered().filter(m => Model.debt(m) > 0).map(m => m.n)); }
  /** Pošle výzvu k platbě rodičům zadaných dětí (jen těm s dluhem). */
  static remind(names) {
    let n = 0;
    names.forEach(name => {
      const d = Model.debt(Model.member(name));
      if (d) { n++; Notifs.send('K', `💳 Výzva k platbě: ${name} – dluh ${d} Kč`, {kid:name, tab:'pay'}); }   // dostanou rodiče dítěte
    });
    UI.importMsg = `Výzva k platbě odeslána: ${n} členů.`;
    App.render();
  }

  /** Import příspěvků z Excelu/CSV: nové sloupce = nové příspěvky, nová jména = noví členové. Vše se uloží do databáze. */
  static importExcel(input) {
    const file = input.files[0]; if (!file) return;
    if (!window.XLSX) { UI.importMsg = 'Knihovnu pro Excel se nepodařilo načíst.'; return App.render(); }
    const reader = new FileReader();
    reader.onload = async e => {
      try {
        const wb = XLSX.read(e.target.result, {type:'array'}), rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''});
        if (!rows.length) throw 0;
        const keys = Object.keys(rows[0]);
        const keyName = keys.find(k => /^(jmen|hrac|name)/.test(Util.norm(k))), keyTeam = keys.find(k => Util.norm(k).startsWith('tym'));
        if (!keyName) throw 0;
        const payKeys = keys.filter(k => k != keyName && k != keyTeam);
        UI.importMsg = 'Importuji…'; App.render();
        // sloupec → index příspěvku (chybějící příspěvek se založí v databázi)
        const idx = [];
        for (const k of payKeys) {
          const amount = (k.match(CONFIG.priceInHeader) || [])[1], name = k.replace(CONFIG.priceInHeader, '').trim() || k;
          let i = DB.payItems.findIndex(x => Util.norm(x.n) == Util.norm(name));
          if (i < 0) {
            const r = await Sync.write('Příspěvek se nepodařilo založit', sb.from('pay_items').insert({name, amount: amount ? +amount.replace(/\s/g, '') : 0, sort: DB.payItems.length + 1}).select().single());
            if (!r) throw new Error('save');
            DB.payItems.push({id: r.data.id, n: r.data.name, a: r.data.amount}); DB.members.forEach(m => m.p.push(0)); i = DB.payItems.length - 1;
          }
          idx.push(i);
        }
        // členové (noví se založí) + zaplaceno / nezaplaceno
        let added = 0, updated = 0; const pay = [];
        for (const r of rows) {
          const name = String(r[keyName]).trim(); if (!name) continue;
          const team = keyTeam && r[keyTeam] ? String(r[keyTeam]).trim() : '';
          let m = Model.member(name);
          if (!m) {
            const res = await Sync.write('Člena se nepodařilo založit', sb.from('players').insert({short_name: name, full_name: name, team: team || '—'}).select().single());
            if (!res) throw new Error('save');
            m = Model.fillProfile({id: res.data.id, n: name, t: res.data.team, a: [0, 0], p: DB.payItems.map(() => 0), full: name}); DB.members.push(m); added++;
          } else {
            updated++;
            if (team && team != m.t) { m.t = team; await Sync.write('Tým se nepodařilo změnit', sb.from('players').update({team}).eq('id', m.id)); }
          }
          payKeys.forEach((k, j) => { const paid = CONFIG.paidWords.test(String(r[k]).trim()); m.p[idx[j]] = paid ? 1 : 0; pay.push({player_id: m.id, item_id: DB.payItems[idx[j]].id, paid}); });
        }
        if (pay.length && !await Sync.write('Platby se nepodařilo uložit', sb.from('player_payments').upsert(pay, {onConflict: 'player_id,item_id'}))) throw new Error('save');
        UI.importMsg = `Import hotov: ${added} nových, ${updated} aktualizovaných členů, ${payKeys.length} příspěvků.`;
      } catch (x) { UI.importMsg = x && x.message == 'save' ? 'Import se nepodařilo uložit do databáze.' : 'Soubor se nepodařilo přečíst – zkontrolujte sloupec „Jméno“.'; }
      input.value = ''; App.render();
    };
    reader.readAsArrayBuffer(file);
  }
}


/* ---------------------------------------------------------------------
   Attendance – docházka na trénincích a účast samotného trenéra (TRENÉR)
   --------------------------------------------------------------------- */
class Attendance {
  /** Záložka "Tréninky": seznam tréninků (vznikají automaticky z rozvrhu hřišť, lze je i ručně přidat nebo zrušit) → po rozkliknutí docházka hráčů. */
  static view() {
    const team = UI.user.team, trainings = Model.eventsOf(team).filter(e => e.k == 't');
    const e = trainings.find(x => x.id == UI.attEvent), count = Model.membersOf(team).length;
    if (!e) {                                                         // 1) seznam tréninků
      UI.attEvent = 0;
      return `${Attendance.mine()}<h2>Tréninky ${team}</h2><div class="g2">${trainings.map(t => {
        const k = Attendance.marked(t);
        return `<div class="card ev ${t.x ? 'x' : 't'}" ${t.x ? '' : `style="cursor:pointer" onclick="Attendance.open('${t.id}')"`}>
          <div class="pay"><b>⚽ ${Util.date(t.d)} · ${t.t}</b><span class="pill ${t.x ? 'x' : k == count ? 'ok' : 'wa'}">${t.x ? 'Zrušeno' : k + '/' + count + ' označeno'}</span></div>
          <div class="mut">📍 ${esc(t.pl)}</div>${t.x ? '' : '<div class="mut">Klepnutím otevřete docházku →</div>'}
          <div class="row" style="margin-top:8px"><button class="btn" onclick="event.stopPropagation();Events.cancel('${t.id}')">${t.x ? 'Obnovit trénink' : 'Zrušit trénink'}</button><button class="btn" style="flex:none;color:var(--r)" onclick="event.stopPropagation();Events.remove('${t.id}')">🗑 Smazat</button></div></div>`;
      }).join('') || '<div class="card mut">Tento týden zatím žádný trénink. Tréninky se přidají automaticky podle rozvrhu hřišť, který nastavuje vedení.</div>'}</div>
      <h2>+ Přidat trénink ručně</h2><div class="card">
        <div class="row"><select id="tr-day">${CONFIG.days.map((n, i) => `<option value="${i}">${Util.date(i)}</option>`).join('')}</select>
          <input id="tr-time" placeholder="Čas (16:00)"></div>
        <select id="tr-place">${CONFIG.venues.map(v => `<option>${v}</option>`).join('')}</select>
        <button class="btn ok" style="width:100%" onclick="Events.add('t')">Přidat trénink</button></div>`;
    }
    return `<button class="btn" onclick="Attendance.close()">← Tréninky</button>        <!-- 2) detail tréninku -->
      <h2>${Util.date(e.d)} · ${e.t} · ${esc(e.pl)}</h2>${Attendance.coachCard(e)}
      <div class="g2" style="margin-top:10px">${Model.membersOf(team).map(m => {
        const a = DB.att[e.id + '|' + m.n], p = Model.attPct(m), [ps, tt] = Model.attCount(m);
        return `<div class="card"><div style="display:flex;gap:10px;align-items:center">${Util.avatar(m, 40)}
            <div style="flex:1;min-width:0"><b>${esc(m.full || m.n)}</b><div class="mut">Účast <b class="${Util.attCls(p)}">${p} %</b> (${ps}/${tt} tréninků)</div></div></div>
          <div class="bar" style="margin:8px 0"><i style="width:${p}%;background:${Util.attBg(p)}"></i></div>
          <div class="row">${CONFIG.attStates.map(([c, l, k]) => `<button class="btn ${a == c ? k : ''}" onclick="Attendance.mark('${e.id}','${Util.q(m.n)}','${c}')">${l}</button>`).join('')}</div></div>`;
      }).join('')}</div>`;
  }

  /** Kolik hráčů už má u tréninku označenou docházku. */
  static marked(e) { return Model.membersOf(e.tm).filter(m => DB.att[e.id + '|' + m.n]).length; }

  /** Karta "Moje účast (trenér)" – trenér potvrdí, jestli přijde (u zrušení se upozorní vedení). */
  /** Karta „Moje docházka“ trenéra: procenta, počet účastí a seznam absencí. */
  static mine() {
    const st = Model.coachStats(UI.user.id), known = st.abs.filter(Boolean), shown = known.slice(0, 8);
    return `<div class="card"><div class="pay"><b>👤 Moje absence a docházka</b>${st.t ? `<span class="pill ${Util.attPill(st.pct)}">${st.p}/${st.t}</span>` : '<span class="pill z">zatím bez údajů</span>'}</div>
      ${st.t ? `<div style="display:flex;align-items:baseline;gap:8px;margin-top:6px"><b class="${Util.attCls(st.pct)}" style="font-size:26px">${st.pct} %</b><span class="mut">účast na trénincích (${st.p}/${st.t})</span></div>
        <div class="bar" style="margin:6px 0 8px"><i style="width:${st.pct}%;background:${Util.attBg(st.pct)}"></i></div>
        <div>${st.abs.length ? `<b>Moje absence (${st.abs.length}):</b> ` + (shown.length ? shown.map(d => esc(Util.isoShort(d))).join(', ') + (known.length > shown.length ? ` a ${known.length - shown.length} dalších` : '') : 'datum se zobrazí po aktualizaci databáze') : '<span class="cg">Žádná absence 👍</span>'}</div>`
        : '<div class="mut" style="margin-top:6px">Docházka se počítá z toho, co u tréninků potvrdíte („Zúčastním se“ / „Nemohu“), nebo z importu tabulky v Nastavení.</div>'}</div>`;
  }

  static coachCard(e, inline) {
    const v = DB.coachAtt[UI.user.id + '|' + e.id];
    return `<div class="${inline ? '' : 'card'}" style="${inline ? 'margin-top:10px' : ''}">
      <div class="pay"><b>👤 Moje účast (trenér)</b>${v ? `<span class="pill ${v == 'y' ? 'ok' : 'no'}">${v == 'y' ? 'Přijdu' : 'Nemohu'}</span>` : ''}</div>
      <div class="row" style="margin-top:8px"><button class="btn ${v == 'y' ? 'ok' : ''}" onclick="Attendance.coachSet(${e.id},'y')">✔ Zúčastním se</button>
      <button class="btn ${v == 'n' ? 'no' : ''}" onclick="Attendance.coachSet(${e.id},'n')">✖ Nemohu</button></div>
      <div class="mut" style="margin-top:6px">Přijdou trenéři: <b>${esc(Model.coachSurnames(e) || '—')}</b></div></div>`;
  }

  // ----- akce -----
  static open(id)  { UI.attEvent = id; App.render(); }   // id události je číslo i text – srovnává se volně
  static close()   { UI.attEvent = 0; App.render(); }
  static mark(eventId, name, state) {
    DB.att[eventId + '|' + name] = state; App.render();
    Sync.saveAttendance(name, eventId, {state});                      // uloží se a trenérům přijde Realtime
  }
  static coachSet(id, v) {
    const e = Model.event(id);
    DB.coachAtt[UI.user.id + '|' + id] = v; DB.coachNm[UI.user.id + '|' + id] = Util.surname(UI.user.name); DB.coachEv[UI.user.id + '|' + id] = {k: e.k, d: Util.iso(Util.dayDate(e.d))};
    Sync.write('Účast se nepodařilo uložit', sb.from('coach_attendance').upsert({event_id: +id, coach_id: UI.user.id, state: v}, {onConflict: 'event_id,coach_id'}));
    if (v == 'n') Notifs.send('V', `⚠ Trenér ${UI.user.name} se nezúčastní: ${e.k == 'z' ? 'zápas' : 'trénink'} ${Util.date(e.d)} (${e.tm})`);
    App.render();
  }
}


/* ---------------------------------------------------------------------
   Events – správa tréninků a zápasů, zrušení, nominace hráčů (TRENÉR)

class Events {
  /** Záložka "Zápasy": seznam zápasů týmu → po rozkliknutí detail (nominace, výsledek, zrušení…), stejně jako u tréninků. */
