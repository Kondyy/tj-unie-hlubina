# Bezplatný projekt Supabase se po 7 dnech bez provozu uspí (hrozí hlavně o prázdninách).
# Tahle úloha každé 3 dny zavolá databázovou funkci keepalive() – nic nečte ani nemění.
# Používá jen veřejný (publishable) klíč, který je i v index.html; žádné tajné údaje nepotřebuje.
name: Udržení Supabase v chodu

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Zavolat keepalive()
        run: |
          curl -fsS -X POST "https://sbiweuhxsemjcvmwavwa.supabase.co/rest/v1/rpc/keepalive" \
            -H "apikey: sb_publishable_bxh21AxUju-g3mMlfvUIjw_KcjkoEO4" \
            -H "Content-Type: application/json" -d '{}'
